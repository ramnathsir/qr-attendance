<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Attendance</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📷 QR Attendance</h1>

    <p>
      Student attendance ke liye
      QR Scanner open karein.
    </p>

    <button onclick="openScanner()">
      Start QR Scanner
    </button>

  </div>


  <script>

    function openScanner() {

      window.location.href = "scanner.html";

    }

  </script>

</body>
</html>
