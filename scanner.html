<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Attendance Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#111827;
}

.header{
  background:#111827;
  color:white;
  text-align:center;
  padding:20px 15px;
}

.header h2{
  margin:0;
  font-size:24px;
}

.header p{
  margin:7px 0 0;
  font-size:14px;
  color:#d1d5db;
}

.container{
  width:94%;
  max-width:650px;
  margin:18px auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h3{
  margin-top:0;
  font-size:20px;
}

input{
  width:100%;
  height:52px;
  padding:12px 14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

button{
  width:100%;
  min-height:52px;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  background:#9ca3af;
}

.gray{
  background:#4b5563;
}

.red{
  background:#dc2626;
}

.green{
  background:#16a34a;
}

#reader{
  width:100%;
  margin:15px auto;
  overflow:hidden;
  border-radius:15px;
}

#reader video{
  width:100% !important;
  height:auto !important;
  border-radius:15px;
}

.status{
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  background:#f3f4f6;
  text-align:center;
  font-size:15px;
  line-height:1.5;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.student{
  margin-top:18px;
  padding:18px;
  background:#f9fafb;
  border-radius:14px;
}

.student img{
  width:140px;
  height:160px;
  object-fit:cover;
  display:block;
  margin:0 auto 15px;
  border-radius:12px;
  background:#e5e7eb;
}

.student-row{
  padding:9px 0;
  border-bottom:1px solid #e5e7eb;
  font-size:16px;
}

.student-row:last-child{
  border-bottom:0;
}

.present{
  margin-top:15px;
  padding:14px;
  background:#dcfce7;
  color:#166534;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
  font-size:18px;
}

.already{
  margin-top:15px;
  padding:14px;
  background:#fef3c7;
  color:#92400e;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
  font-size:18px;
}

.hidden{
  display:none;
}

@media(max-width:600px){

  .header{
    padding:16px 10px;
  }

  .header h2{
    font-size:21px;
  }

  .container{
    width:94%;
    margin:12px auto;
  }

  .card{
    padding:15px;
    border-radius:15px;
  }

  .card h3{
    font-size:18px;
  }

  #reader{
    width:100%;
  }

  button{
    min-height:54px;
    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <h2>📷 QR Attendance System</h2>

  <p>Admin Scanner</p>

</div>


<div class="container">


<!-- LOGIN -->

<div
  id="loginCard"
  class="card"
>

  <h3>🔐 Admin Login</h3>

  <p>
    Student QR me PIN nahi hota.
    Admin/Teacher sirf yahan PIN dalega.
  </p>

  <input
    id="pin"
    type="password"
    placeholder="Enter Admin PIN"
  >

  <button
    onclick="login()"
  >
    Login & Continue
  </button>

  <div id="loginStatus"></div>

</div>


<!-- SCANNER -->

<div
  id="scannerCard"
  class="card hidden"
>

  <h3>📷 Scan Student QR</h3>

  <div
    id="cameraStatus"
    class="status"
  >
    Camera start karne ke liye
    button dabao.
  </div>


  <div id="reader"></div>


  <button
    id="startBtn"
    onclick="startScanner()"
  >
    📷 Start Camera
  </button>


  <button
    id="stopBtn"
    class="gray"
    onclick="stopScanner()"
  >
    ⛔ Stop Camera
  </button>


  <button
    class="red"
    onclick="closeAttendance()"
  >
    🔒 Close Attendance & Mark Absent
  </button>

</div>


<!-- RESULT -->

<div
  id="resultCard"
  class="card hidden"
>

  <h3>👤 Student Details</h3>

  <div id="result"></div>

</div>


</div>


<script>


/* =========================================
   CONFIG
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzvbXPrZjmKNNaq55w5zK7SEN8LAWLHUISyTB7mpG5kQyiHKNDtkoTZ2wxdbTdDpEt7/exec";

/* =========================================
   VARIABLES
========================================= */

let adminPin = "";

let scanner = null;

let scanning = false;

let processing = false;


/* =========================================
   LOGIN
========================================= */

function login(){

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if(!pin){

    showStatus(
      "loginStatus",
      "Admin PIN enter karo.",
      "error"
    );

    return;
  }


  showStatus(
    "loginStatus",
    "PIN verify ho raha hai...",
    "warning"
  );


  const callbackName =
    "loginCallback_" +
    Date.now();


  window[callbackName] =
    function(result){

      if(
        result &&
        result.ok
      ){

        adminPin = pin;


        document
          .getElementById("loginCard")
          .classList
          .add("hidden");


        document
          .getElementById("scannerCard")
          .classList
          .remove("hidden");


        showStatus(
          "cameraStatus",
          "✅ Login successful. Ab Start Camera dabao.",
          "success"
        );

      }

      else{

        showStatus(
          "loginStatus",
          "❌ Invalid Admin PIN.",
          "error"
        );

      }


      delete window[callbackName];

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=login" +
    "&pin=" +
    encodeURIComponent(pin) +
    "&callback=" +
    callbackName;


  script.onerror =
    function(){

      showStatus(
        "loginStatus",
        "❌ Apps Script server se connection nahi ho raha.",
        "error"
      );


      delete window[callbackName];

    };


  document.body.appendChild(script);

}


/* =========================================
   START CAMERA
========================================= */

async function startScanner(){

  if(scanning){
    return;
  }


  try{

    showStatus(
      "cameraStatus",
      "📷 Camera detect ho raha hai...",
      "warning"
    );


    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        "Camera nahi mila."
      );

    }


    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        function(camera){

          return /back|rear|environment/i
            .test(camera.label);

        }
      );


    if(backCamera){

      cameraId =
        backCamera.id;

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      cameraId,

      {

        fps:15,

        qrbox:function(
          width,
          height
        ){

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.65
            );


          return {

            width:size,

            height:size

          };

        },

        aspectRatio:1.0

      },


      function(decodedText){

        processQR(
          decodedText
        );

      },


      function(errorMessage){

        // Normal QR scanning error

      }

    );


    scanning = true;


    showStatus(
      "cameraStatus",
      "🟢 Camera ON — Student ka QR camera ke saamne lao.",
      "success"
    );

  }


  catch(error){

    console.error(error);


    showStatus(
      "cameraStatus",
      "❌ Camera start nahi hua: " +
      error.message,
      "error"
    );

  }

}


/* =========================================
   STOP CAMERA
========================================= */

async function stopScanner(){

  if(
    !scanner ||
    !scanning
  ){

    return;

  }


  try{

    await scanner.stop();

    scanner.clear();

  }

  catch(error){

    console.error(error);

  }


  scanner = null;

  scanning = false;


  showStatus(
    "cameraStatus",
    "Camera stopped.",
    ""
  );

}


/* =========================================
   PROCESS QR
========================================= */

function processQR(
  decodedText
){

  if(processing){
    return;
  }


  const studentId =
    String(decodedText || "")
      .trim();


  if(!studentId){
    return;
  }


  processing = true;


  if(
    scanner &&
    scanning
  ){

    try{

      scanner.pause(true);

    }

    catch(e){}

  }


  showStatus(
    "cameraStatus",
    "🔍 QR mil gaya! Student verify ho raha hai...",
    "warning"
  );


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  window[callbackName] =
    function(result){

      showAttendanceResult(
        result
      );


      processing = false;


      if(
        scanner &&
        scanning
      ){

        setTimeout(
          function(){

            try{

              scanner.resume();

            }

            catch(e){}

          },
          2500
        );

      }


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=attendance" +
    "&studentId=" +
    encodeURIComponent(
      studentId
    ) +
    "&pin=" +
    encodeURIComponent(
      adminPin
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function(){

      showStatus(
        "cameraStatus",
        "❌ Server response nahi mila.",
        "error"
      );


      processing = false;


      if(
        scanner &&
        scanning
      ){

        try{

          scanner.resume();

        }

        catch(e){}

      }

    };


  document.body
    .appendChild(script);

}


/* =========================================
   SHOW ATTENDANCE
========================================= */

function showAttendanceResult(
  result
){

  document
    .getElementById("resultCard")
    .classList
    .remove("hidden");


  if(!result){

    showStatus(
      "cameraStatus",
      "Invalid server response.",
      "error"
    );

    return;
  }


  /* PRESENT */

  if(result.ok){

    showStatus(
      "cameraStatus",
      "✅ PRESENT — " +
      result.student.name,
      "success"
    );


    showStudent(
      result.student,
      result.date,
      result.time,
      "PRESENT"
    );


    return;

  }


  /* DUPLICATE */

  if(result.duplicate){

    showStatus(
      "cameraStatus",
      "⚠️ Aaj attendance already marked hai.",
      "warning"
    );


    showStudent(
      result.student,
      result.date,
      result.time,
      "ALREADY PRESENT"
    );


    return;

  }


  /* ERROR */

  showStatus(
    "cameraStatus",
    "❌ " +
    (
      result.message ||
      "Student not found."
    ),
    "error"
  );

}


/* =========================================
   CLOSE ATTENDANCE
========================================= */

function closeAttendance(){

  if(!adminPin){

    alert(
      "Please login first."
    );

    return;

  }


  const confirmClose =
    confirm(
      "Attendance close karna hai?\n\n" +
      "Jo students scan nahi hue hain " +
      "unko ABSENT mark kiya jayega."
    );


  if(!confirmClose){

    return;

  }


  showStatus(
    "cameraStatus",
    "⏳ Attendance close ho rahi hai...",
    "warning"
  );


  const callbackName =
    "closeAttendanceCallback_" +
    Date.now();


  window[callbackName] =
    function(result){

      if(
        result &&
        result.ok
      ){

        showStatus(
          "cameraStatus",
          "✅ Attendance Closed — " +
          result.absentCount +
          " students ABSENT.",
          "success"
        );


        alert(
          "Attendance Closed Successfully!\n\n" +
          "Absent Students: " +
          result.absentCount
        );

      }

      else{

        showStatus(
          "cameraStatus",
          "❌ " +
          (
            result?.message ||
            "Attendance close nahi hui."
          ),
          "error"
        );

      }


      delete window[callbackName];

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=closeAttendance" +
    "&pin=" +
    encodeURIComponent(adminPin) +
    "&callback=" +
    callbackName;


  script.onerror =
    function(){

      showStatus(
        "cameraStatus",
        "❌ Server response nahi mila.",
        "error"
      );


      delete window[callbackName];

    };


  document.body
    .appendChild(script);

}


/* =========================================
   SHOW STUDENT
========================================= */

function showStudent(
  student,
  date,
  time,
  status
){

  const result =
    document.getElementById(
      "result"
    );


  let photo = "";


  if(
    student.photoUrl
  ){

    photo = `

      <img
        src="${escapeHtml(
          student.photoUrl
        )}"
        alt="Student Photo"
        onerror="this.style.display='none';"
      >

    `;

  }


  let statusHTML;


  if(
    status === "PRESENT"
  ){

    statusHTML = `

      <div class="present">
        ✅ PRESENT
      </div>

    `;

  }

  else{

    statusHTML = `

      <div class="already">
        ⚠️ ALREADY PRESENT
      </div>

    `;

  }


  result.innerHTML = `

    <div class="student">

      ${photo}


      <div class="student-row">

        <b>Name:</b>
        ${escapeHtml(
          student.name
        )}

      </div>


      <div class="student-row">

        <b>Student ID:</b>
        ${escapeHtml(
          student.studentId
        )}

      </div>


      <div class="student-row">

        <b>Class:</b>
        ${escapeHtml(
          student.studentClass
        )}

      </div>


      <div class="student-row">

        <b>Roll No:</b>
        ${escapeHtml(
          student.rollNo
        )}

      </div>


      <div class="student-row">

        <b>Date:</b>
        ${escapeHtml(
          date || "-"
        )}

      </div>


      <div class="student-row">

        <b>Time:</b>
        ${escapeHtml(
          time || "-"
        )}

      </div>


      ${statusHTML}

    </div>

  `;

}


/* =========================================
   STATUS
========================================= */

function showStatus(
  id,
  text,
  type
){

  const element =
    document.getElementById(
      id
    );


  element.textContent =
    text;


  element.className =
    "status " +
    (
      type || ""
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
